name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: BeyondSpaceTrader-Linux.zip
          - os: windows-latest
            artifact_name: BeyondSpaceTrader-Windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package -DskipTests

      - name: Compress Linux output
        if: matrix.os == 'ubuntu-latest'
        run: cd output && zip -r ../${{ matrix.artifact_name }} BeyondSpaceTrader

      - name: Compress Windows output
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path output\BeyondSpaceTrader -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
