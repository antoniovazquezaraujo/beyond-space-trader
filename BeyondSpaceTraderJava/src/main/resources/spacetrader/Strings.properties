Alert.WildArrested.title=Wild Arrested
Alert.WildArrested.message=Jonathan Wild is arrested, and taken away to stand trial.
Alert.WildArrested.button1=Ok
Alert.WildChatsPirates.title=Wild Chats With Pirates
Alert.WildChatsPirates.message=The Pirate Captain turns out to be an old associate of Jonathan Wild's. They talk about old times, and you get the feeling that Wild would switch ships if the Pirates had any quarters available.
Alert.WildChatsPirates.button1=Ok
Alert.WildGoesPirates.title=Wild Goes With Pirates
Alert.WildGoesPirates.message=The Pirate Captain turns out to be an old associate of Jonathan Wild's, and invites him to go to Kravat aboard the Pirate ship. Wild accepts the offer and thanks you for the ride.
Alert.WildGoesPirates.button1=Ok
Alert.WildLeavesShip.title=Wild Leaves Ship
Alert.WildLeavesShip.message=Jonathan Wild leaves your ship, and goes into hiding on ^1.
Alert.WildLeavesShip.button1=Ok
Alert.WildSculpture.title=Wild Eyes Sculpture
Alert.WildSculpture.message=Jonathan Wild sees the stolen sculpture. "Wow, I only know of one of these left in the whole Universe!" he exclaims, "Geurge Locas must be beside himself with it being stolen." He seems very impressed with you, which makes you feel much better about the item your delivering.
Alert.WildSculpture.button1=Ok
