EncounterPrincessRescued=\n\nYou land your ship near where the Space Corps has landed with the Scorpion in tow. The Princess is revived from hibernation and you get to see her for the first time. Instead of the spoiled child you were expecting, Ziyal is possible the most beautiful woman you've ever seen. "What took you so long?" she demands. You notice a twinkle in her eye, and then she smiles. Not only is she beautiful, but she's got a sense of humor. She says, "Thank you for freeing me. I am in your debt." With that she give you a kiss on the cheek, then leaves. You hear her mumble, "Now about a ride home."
