EncounterPrincessRescued=\n\nAterrizas tu nave cerca de donde el Cuerpo Espacial ha aterrizado con el Escorpión a remolque. La Princesa revive de la hibernación y la ves por primera vez. En lugar de la niña mimada que esperabas, Ziyal es posiblemente la mujer más bella que hayas visto. "¿Qué te ha retrasado tanto?", exige saber. Le ves un brillo en los ojos y luego sonríe. No solo es bella, sino que tiene sentido del humor. Dice: "Gracias por liberarme. Estoy en deuda contigo". Con eso te da un beso en la mejilla y se marcha. La oyes murmurar: "Y ahora, ¿cómo vuelvo a casa?"
