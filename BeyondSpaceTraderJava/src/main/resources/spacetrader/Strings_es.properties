SpecialEventStrings.0=Este artefacto alienígena debería entregarse al profesor Berger, que ahora está de viaje. Probablemente lo encuentres en algún sistema solar de alta tecnología. Sin embargo, la raza alienígena que creó el artefacto parece empeñada en recuperarlo y puede entorpecer al portador. ¿Estás dispuesto a entregarlo, por un precio?
SpecialEventStrings.1=Soy el profesor Berger. Te agradezco que me hayas traído el artefacto alienígena. Espero que los alienígenas no hayan sido una molestia. He transferido 20.000 créditos a tu cuenta, que supongo compensan las molestias.
SpecialEventStrings.2=Un comerciante de artículos de segunda mano te ofrece 3 contenedores de carga precintados por 1.000 créditos. Podría ser un buen negocio: quizá contengan robots. Aunque también podrían ser solo agua. ¿Quieres los contenedores?
SpecialEventStrings.3=Al habla el coronel Jackson, del Cuerpo Espacial. Han robado una nave experimental, con nombre en clave "Dragonfly". Está equipada con escudos muy especiales, casi indestructibles. No debería caer en malas manos y te recompensaremos si la destruyes. La última vez que se la vio fue en el sistema Baratas.
SpecialEventStrings.4=Una pequeña nave de diseño extraño atracó aquí hace poco para reparaciones. El ingeniero que trabajó en ella dijo que tenía un casco débil, pero unos escudos increíblemente fuertes. Oí que despegó en dirección al sistema Melina.
SpecialEventStrings.5=Hola, Comandante. Soy el coronel Jackson otra vez. En nombre del Cuerpo Espacial, te agradezco tu valiosa ayuda para destruir el Dragonfly. Como recompensa, instalaremos uno de los escudos experimentales en tu nave. Vuelve aquí cuando estés listo y lo haremos.
SpecialEventStrings.6=Una nave con escudos que parecían de rayos combatió hace poco contra muchas naves en nuestro sistema. Nunca había visto nada igual. Después de marcharse, oí que fue al sistema Regulas.
SpecialEventStrings.7=Hace unos días estuvo aquí una nave pequeña con unos escudos como nunca había visto. ¡Destruyó al menos diez naves policiales! Lo último que supe es que fue al sistema Zalkon.
SpecialEventStrings.8=Al habla el coronel Jackson. ¿Quieres que instalemos un escudo de rayos en tu nave actual?
SpecialEventStrings.9=Un hacker te cuenta que ha descifrado las contraseñas de la red informática policial de toda la galaxia y que puede borrar tu historial policial por 5.000 créditos. ¿Quieres que lo haga?
SpecialEventStrings.10=Mientras revisaba los planos del nuevo motor de distorsión espacial del Dr. Fehler, el Dr. Lowenstam descubrió un error crítico. Si no vas a Daled y detienes el experimento en diez días, ¡el propio continuo espacio-tiempo podría dañarse!
SpecialEventStrings.11=El Dr. Fehler no entiende por qué falló el experimento. Pero el fallo ha tenido un efecto dramático y desastroso sobre el tejido del espacio-tiempo. Parece que el Dr. Fehler no obtendrá la cátedra pronto... ¡y tú puedes tener problemas al saltar!
SpecialEventStrings.12=Al recibir tu aviso, el Dr. Fehler cancela el experimento. Como recompensa, te entregan una Singularidad Portátil. Este dispositivo te transportará al instante, una sola vez, a cualquier sistema de la galaxia. Puedes usar la Singularidad pulsando la tecla "G" (Salto) en el mapa galáctico.
SpecialEventStrings.13=Hemos recibido la noticia de que los alienígenas invadirán Gemulon dentro de siete días. Sabemos exactamente en qué coordenadas llegarán, pero no podemos avisar a Gemulon porque una tormenta iónica perturba todas las comunicaciones. Necesitamos a alguien, a quien sea, que lleve esta información a Gemulon en seis días.
SpecialEventStrings.14=¿Quieres que instalemos el compactador de combustible en tu nave actual? (Necesitas una ranura de artilugio libre)
SpecialEventStrings.15=Por desgracia, los alienígenas han invadido Gemulon, lo que nos ha devuelto a tiempos preagrícolas. Si hubiéramos sabido las coordenadas exactas donde llegaron por primera vez a nuestro sistema, podríamos haber evitado esta tragedia.
SpecialEventStrings.16=Esta información sobre la llegada de la fuerza de invasión alienígena nos permite preparar la defensa. Has salvado nuestra forma de vida. Como recompensa, tenemos un artilugio compactador de combustible para ti, que aumentará en 3 pársecs la distancia de viaje de cualquier nave. Vuelve aquí para instalarlo.
SpecialEventStrings.17=Una extraña enfermedad ha invadido el sistema Japori. Nos gustaría que llevaras estos diez contenedores de antídoto especial a Japori. Ten en cuenta que, si aceptas, diez de tus bodegas de carga quedarán ocupadas durante el viaje a Japori. ¿Aceptas la misión?
SpecialEventStrings.18=Gracias por traernos la medicina. No tenemos dinero para recompensarte, pero sí una máquina alienígena de aprendizaje rápido con la que aumentaremos tus habilidades.
SpecialEventStrings.19=Un cambio reciente en el clima político de este sistema solar ha obligado al embajador Jarek a huir de vuelta a su sistema natal, Devidia. ¿Le llevarías?
SpecialEventStrings.20=El embajador Jarek te está muy agradecido por devolverle a Devidia. Como recompensa, te da un ordenador regateador portátil experimental, que te permite conseguir mayores descuentos al comprar mercancías y equipo.
SpecialEventStrings.21=¡Tienes suerte! Mientras atracabas en el puerto espacial, recibes un mensaje de que has ganado 1.000 créditos en una lotería. El premio ya se ha añadido a tu cuenta.
SpecialEventStrings.22=Hay una luna pequeña pero habitable en venta en el sistema Utopia, por el razonable precio de medio millón de créditos. Si la aceptas, puedes jubilarte en ella y vivir una vida tranquila, feliz y rica. ¿Quieres comprarla?
SpecialEventStrings.23=Bienvenido al sistema Utopia. Tu propia luna está disponible para que te jubiles en ella, si te apetece. ¿Estás listo para jubilarte y llevar una vida feliz, tranquila y rica?
SpecialEventStrings.24=El criminal galáctico Henry Morgan quiere que este reactor iónico ilegal se entregue en Nix. ¡Es una misión muy peligrosa! El reactor y su combustible son voluminosos: ocupan 15 bodegas. Peor aún, no es estable: su energía resonante debilitará tus escudos y la resistencia de tu casco mientras esté a bordo. ¿Estás dispuesto a entregarlo?
SpecialEventStrings.25=Henry Morgan recibe el reactor con gran alegría. Sus hombres se ponen de inmediato a estabilizar el sistema de combustible. Como recompensa, Morgan te ofrece un láser especial de gran potencia, diseñado por él. Vuelve con una ranura de arma vacía cuando quieras que lo instalen.
SpecialEventStrings.26=Los técnicos de Morgan te esperan con algo que se parece mucho a un láser militar... si ignoras las respiraderos de refrigeración adicionales y los conductos anodizados. ¿Quieres que instalen el láser especial de Morgan?
SpecialEventStrings.27=El capitán Renwick desarrolló un nuevo material orgánico para el casco de su nave, que no puede dañarse salvo con láseres de pulso. Mientras celebraba el éxito, los piratas abordaron la nave y se la robaron, y la han bautizado como Escarabeo. Se rumorea que la esconden en la salida de un agujero de gusano. ¡Destruye la nave y llévate una recompensa!
SpecialEventStrings.28=El Cuerpo Espacial te está en deuda por destruir el Escarabeo y a los piratas que lo robaron. Como recompensa, podemos hacer que el capitán Renwick mejore el casco de tu nave. ¡Ten en cuenta que sus mejoras no se transferirán si compras una nave nueva! Vuelve con la nave que quieras mejorar.
SpecialEventStrings.29=El casco orgánico del Escarabeo todavía no está listo para el uso diario. Pero el capitán Renwick puede mejorar tu casco con parte de su tecnología de adaptación. Es material ligero y no reducirá el alcance de tu nave. ¿Mejora tu nave?
SpecialEventStrings.30=Un alienígena con una máquina de aprendizaje rápido te ofrece aumentar una de tus habilidades por el razonable precio de 3.000 créditos. Eso sí, no podrás elegir cuál. ¿Aceptas su oferta?
SpecialEventStrings.31=Un monstruo espacial ha invadido el sistema Acamar y está alterando las rutas comerciales. Te recompensarán generosamente si consigues destruirlo.
SpecialEventStrings.32=Te agradecemos que hayas destruido al monstruo espacial que tanto tiempo estuvo rondando nuestro sistema. Acepta 15.000 créditos como recompensa por tu hazaña.
SpecialEventStrings.33=Un príncipe mercader te ofrece un objeto muy especial y maravilloso por 1.000 créditos. ¿Aceptas?
SpecialEventStrings.34=Un excéntrico multimillonario alienígena quiere comprar tu colección de tribbles y ofrece medio crédito por cada uno. ¿Aceptas su oferta?
SpecialEventStrings.35=Las fuerzas del orden están acorralando al notorio capo criminal Jonathan Wild. Te recompensaría generosamente por llevarle de contrabando a su casa, en Kravat. Tendrías que evitar que la policía te capture por el camino. ¿Le das un camarote?
SpecialEventStrings.36=Jonathan Wild te está muy agradecido por ponerle a salvo. Como recompensa, hace que uno de sus cibercriminales entre en la base de datos policial y limpie tu historial. También te ofrece la oportunidad de llevarte a su talentoso sobrino Zeethibal como mercenario sin sueldo.
SpecialEventStrings.37=Una figura encapuchada se te acerca y te pregunta si estarías dispuesto a entregar cierta mercancía recién adquirida en Endor. Sostiene una pequeña escultura de un hombre con una especie de espada de luz que sospechas mucho que fue robada. Parece de plástico y no muy valiosa. "Te pagaré 2.000 créditos ahora y 15.000 a la entrega", dice la figura. Al ver tu cara, añade: "Es una pieza de coleccionista. ¿La entregas o no?"
SpecialEventStrings.38=Otra figura oscura y encapuchada se acerca. "¿Tienes la figura de acción... esto, la escultura?". Se la entregas y oyes lo que suena mucho a una risita bajo la capucha. "Sé que te prometieron 15.000 créditos a la entrega, pero ahora ando mal de dinero. Sin embargo, tengo algo mejor para ti. Conozco a alguien que puede instalar compartimentos ocultos en tu nave". Vuelve con una ranura de artilugio vacía cuando quieras instalarlos.
SpecialEventStrings.39=Te llevan a un almacén y te hacen pasar por la puerta en un suspiro. Se acerca un alienígena sucio de alguna especie humanoide -no sabes cuál-. "Así que tú eres quien necesita Compartimentos Ocultos. ¿Los instalo en tu nave?" (Requiere una ranura de artilugio libre).
SpecialEventStrings.40=¡Han secuestrado a un miembro de la familia real de Galvon! Unos hombres secuestraron a la princesa Ziyal mientras viajaba por el planeta. Escaparon en una nave de alta tecnología llamada Escorpión. ¡Rescátala! (Tendrás que equipar tu nave con disruptores para poder vencer al Escorpión sin destruirlo). Una nave erizada de armas salió disparada del sistema. Su trayectoria antes de saltar indica que su destino era Centauri.
SpecialEventStrings.41=Una nave mejoró sus escudos a Escudos de Rayos hace solo dos días. Un trabajador del astillero oyó a uno de la tripulación decir que se dirigían a Inthara.
SpecialEventStrings.42=Ayer mismo se vio una nave en el muelle 327. Un comerciante vendió mercancías a un miembro de la tripulación, natural de Qonos. Es posible que fuera su siguiente destino.
SpecialEventStrings.43=El embajador galvoniano en Qonos se te acerca. La princesa necesita que la lleven a casa. ¿La llevarás? No creo que se sienta segura con nadie más.
SpecialEventStrings.44=Astillero de Su Majestad: ¿quieres que instalemos un disruptor cuántico en tu nave actual?
SpecialEventStrings.45=El rey y la reina te están enormemente agradecidos por devolverles a su hija. El rey dice: "Ziyal no tiene precio para nosotros, pero sentimos que debemos ofrecerte algo como recompensa. Visita al capitán de mi astillero y te instalará uno de nuestros nuevos Disruptores Cuánticos".
