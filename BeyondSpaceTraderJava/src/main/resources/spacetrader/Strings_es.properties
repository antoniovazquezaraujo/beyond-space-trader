EquipmentDescriptions.0.0=El Láser de Pulso es el arma más débil disponible. Su pequeño tamaño solo permite acumular energía suficiente para emitir pulsos de luz.
EquipmentDescriptions.0.1=El Láser de Haz es más grande que el Láser de Pulso, así que puede acumular carga suficiente para alimentar lo que en esencia son dos Láseres de Pulso. El efecto resultante parece más un haz continuo.
EquipmentDescriptions.0.2=El Láser Militar es el arma más grande disponible en el mercado. Puede acumular carga suficiente para alimentar tres Láseres de Pulso en serie, lo que produce un haz más denso y concentrado.
EquipmentDescriptions.0.3=El Láser de Morgan se ha construido a partir de un Láser de Haz, al que se ha acoplado un reactor iónico que acumula una carga inmensa, lo que da el arma más potente que se conoce.
EquipmentDescriptions.0.4=El Disruptor de Fotones es un arma relativamente débil, pero puede inutilizar los sistemas eléctricos del oponente y dejarlo indefenso.
EquipmentDescriptions.0.5=El Disruptor Cuántico es un arma inhabilitante muy potente. Cuando los escudos del oponente han caído, suele bastar un solo disparo del Disruptor Cuántico para inutilizarlo.
EquipmentDescriptions.1.0=El Escudo de Energía es un escudo deflector muy básico. Su principio de funcionamiento es absorber la energía dirigida contra él.
EquipmentDescriptions.1.1=El Escudo Reflectante es el doble de potente que el Escudo de Energía. Funciona reflejando la energía dirigida contra él en lugar de absorberla.
EquipmentDescriptions.1.2=El Escudo de Rayos es el escudo más potente que se conoce. Consiste en un Escudo Reflectante que opera en una frecuencia giratoria, lo que hace que parezcan relámpagos recorrer la barrera del escudo.
EquipmentDescriptions.2.0=Bodegas de carga extra para guardar todo lo que tu nave pueda llevar como carga.
EquipmentDescriptions.2.1=El Sistema de Autorreparación reduce el daño que sufre tu nave en combate y repara algunos daños entre encuentros. También mejora todas las demás funciones de ingeniería.
EquipmentDescriptions.2.2=El Sistema de Navegación aumenta la habilidad general de pilotaje de la nave, lo que la hace más difícil de alcanzar en combate y facilita huir de un encuentro.
EquipmentDescriptions.2.3=El Sistema de Puntería aumenta la habilidad general de combate de la nave, lo que incrementa el daño infligido al oponente en combate.
EquipmentDescriptions.2.4=El Dispositivo de Camuflaje puede permitir que tu nave evite que la detecte un oponente, pero solo si la habilidad de ingeniería de tu nave es mayor que la del oponente. También hace que tu nave sea más difícil de alcanzar en combate.
EquipmentDescriptions.2.5=El Compactador de Combustible que obtuviste como recompensa por avisar a Gemulon de la invasión aumentará el alcance de tu nave en 3 pársecs.
EquipmentDescriptions.2.6=Estas bodegas extra no se detectan en los registros rutinarios de la policía. Pueden detectarse si te detienen y la policía hace un registro más exhaustivo.
